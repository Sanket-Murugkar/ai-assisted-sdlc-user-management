# --- Application ---
user-management.dynamodb.table-name=${USER_MANAGEMENT_DYNAMODB_TABLE_NAME:users}

# --- DynamoDB client ---
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.sync-client.type=url
# DynamoDB Local comes only from Docker Compose (dev) and DynamoDbLocalResource (tests).
quarkus.dynamodb.devservices.enabled=false

# Dev and test talk to DynamoDB Local with dummy credentials.
# Prod (including Compose) uses the default AWS credentials chain;
# set QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE to point it at DynamoDB Local.
%dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=local
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=local
%test.quarkus.dynamodb.endpoint-override=http://localhost:8000
%test.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=local
%test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=local

# --- Logging ---
# JSON console logs in prod, plain text locally.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
